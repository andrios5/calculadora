<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porcentagem | Calculadora X</title>
    <meta name="description" content="Calcule percentuais em segundos. Preencha dois valores e o terceiro é calculado automaticamente." />

    <link rel="shortcut icon" href="ico/chart.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@40,400,0,0"/>
    <link rel="stylesheet" href="app.css">
    <script src="theme.js"></script>
</head>

<body class="app-page porcentagem">
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>

    <header class="site-header">
        <div class="header-inner">
            <h1 class="brand-heading">
                <a class="brand-link" href="index.htm" rel="home">
                    <span class="brand-mark material-symbols-outlined" aria-hidden="true">calculate</span>
                    <span class="brand-name">Calculadora X</span>
                </a>
            </h1>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar tema claro/escuro">
                <span class="material-symbols-outlined" aria-hidden="true">dark_mode</span>
            </button>
        </div>
    </header>

    <main id="conteudo" class="app-main">
        <h2 class="page-title">
            <span class="page-icon material-symbols-outlined" aria-hidden="true">percent</span>
            Porcentagem
        </h2>

        <section class="out">
            <p class="intro">Preencha dois valores de qualquer campo e o terceiro será calculado automaticamente.</p>

            <div class="porc-grid">
                <div class="porc-field1">
                    <label for="por1">Valor 1</label>
                    <input type="number" name="por1" id="por1" placeholder="Ex: 50" min="0" step="any">
                </div>

                <div class="porc-field1">
                    <label for="por2">Valor 2</label>
                    <input type="number" name="por2" id="por2" placeholder="Ex: 200" min="0" step="any">
                </div>
            </div>

            <div class="porc-field porc-pct">
                <label for="por3">Porcentagem</label>
                <div class="porc-input-wrap">
                    <input type="number" name="por3" id="por3" placeholder="Ex: 25" min="0" step="any">
                    <span class="porc-suffix">%</span>
                </div>
            </div>

            <div class="porc-reset">
                <button type="button" id="resetP">
                    <span class="material-symbols-outlined" aria-hidden="true">restart_alt</span>
                    Reset
                </button>
            </div>
        </section>
    </main>

    <script src="porcentagem.js"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RQ819RVB2H"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-RQ819RVB2H');
    </script>
</body>
</html>
