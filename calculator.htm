<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora | Calculadora X</title>
    <meta name="description" content="Calculadora básica para usar com a tela do celular ou teclado físico, no mesmo padrão da Calculadora X." />

    <!-- Se ainda não tiver ico/calculadora.ico, troque por ico/favicon.ico -->
    <link rel="shortcut icon" href="ico/calculadora.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@40,400,0,0"/>
    <link rel="stylesheet" href="app.css">
    <script src="theme.js"></script>
</head>

<body class="app-page calculadora">
        <section class="out calc-card" aria-label="Calculadora">
            <div class="calc-display" role="status" aria-live="polite">
                <p class="calc-expression" id="calc-expression"></p>
                <output class="calc-value" id="calc-value">0</output>
            </div>
                <div class="calc-grid" id="calc-grid" role="group" aria-label="Teclado da calculadora">
                    <!-- Linha 1 -->
                    <button type="button" class="calc-btn calc-btn--fn" data-action="clear-all">AC</button>
                    <button type="button" class="calc-btn calc-btn--fn" data-action="backspace" aria-label="Apagar último dígito">⌫</button>
                    <button type="button" class="calc-btn calc-btn--fn" data-action="percent" aria-label="Porcentagem">%</button>
                    <button type="button" class="calc-btn calc-btn--op" data-op="/" aria-label="Dividir">÷</button>

                    <!-- Linha 2 -->
                    <button type="button" class="calc-btn calc-btn--digit" data-digit="7">7</button>
                    <button type="button" class="calc-btn calc-btn--digit" data-digit="8">8</button>
                    <button type="button" class="calc-btn calc-btn--digit" data-digit="9">9</button>
                    <button type="button" class="calc-btn calc-btn--op" data-op="*" aria-label="Multiplicar">×</button>

                    <!-- Linha 3 -->
                    <button type="button" class="calc-btn calc-btn--digit" data-digit="4">4</button>
                    <button type="button" class="calc-btn calc-btn--digit" data-digit="5">5</button>
                    <button type="button" class="calc-btn calc-btn--digit" data-digit="6">6</button>
                    <button type="button" class="calc-btn calc-btn--op" data-op="-" aria-label="Subtrair">−</button>

                    <!-- Linha 4 -->
                    <button type="button" class="calc-btn calc-btn--digit" data-digit="1">1</button>
                    <button type="button" class="calc-btn calc-btn--digit" data-digit="2">2</button>
                    <button type="button" class="calc-btn calc-btn--digit" data-digit="3">3</button>
                    <button type="button" class="calc-btn calc-btn--op" data-op="+" aria-label="Somar">+</button>

                    <!-- Linha 5 -->
                    <button type="button" class="calc-btn calc-btn--fn" data-action="toggle-sign" aria-label="Inverter sinal">±</button>
                    <button type="button" class="calc-btn calc-btn--digit" data-digit="0">0</button>
                    <button type="button" class="calc-btn calc-btn--digit" data-action="decimal" aria-label="Vírgula decimal">,</button>
                    <button type="button" class="calc-btn calc-btn--equals" data-action="equals" aria-label="Igual">=</button>
                </div>
        </section>


    <script src="calculadora.js"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RQ819RVB2H"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-RQ819RVB2H');
    </script>
</body>
</html>
