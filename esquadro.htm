<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esquadro | Calculadora X</title>
    <meta name="description" content="Resolva cálculos de triângulos retângulos com o Teorema de Pitágoras." />

    <link rel="shortcut icon" href="ico/ruler.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@40,400,0,0"/>
    <link rel="stylesheet" href="app.css">
    <script src="theme.js"></script>
</head>

<body class="app-page esquadro-page">
    <header class="site-header">
        <div class="header-inner">
            <h1 class="brand-heading">
                <a class="brand-link" href="index.htm" rel="home">
                    <span class="brand-mark material-symbols-outlined" aria-hidden="true">calculate</span>
                    <span class="brand-name">Calculadora X</span>
                </a>
            </h1>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar tema claro/escuro">
                <span class="material-symbols-outlined" aria-hidden="true">dark_mode</span>
            </button>
        </div>
    </header>

    <main id="conteudo" class="app-main">
        <h2 class="page-title">
            <span class="page-icon material-symbols-outlined" aria-hidden="true">square_foot</span>
            Esquadro
        </h2>

        <section class="out">

            <div class="esquadro-container">
                <div class="esquadro">
                    <!-- Triângulo decorativo -->
                    <svg class="esq-tri" viewBox="0 0 240 220" aria-hidden="true">
                        <path d="M 30 195 L 210 195 L 30 25 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
                    </svg>

                    <!-- Lado A (vertical, esquerda) -->
                    <div class="lado-vertical">
                        <input type="number" name="esq1" id="esq1" value="3" class="input-lado" placeholder="3" min="0" step="any">
                        <span class="label-lado">Lado A</span>
                    </div>

                    <!-- Lado B (horizontal, baixo) -->
                    <div class="lado-horizontal">
                        <input type="number" name="esq2" id="esq2" value="4" class="input-lado" placeholder="4" min="0" step="any">
                        <span class="label-lado">Lado B</span>
                    </div>

                    <!-- Hipotenusa (diagonal, superior direito) -->
                    <div class="hipotenusa">
                        <input type="number" name="esq3" id="esq3" value="5" class="input-hipotenusa" placeholder="5" min="0" step="any">
                        <span class="label-hipotenusa">Hipotenusa</span>
                    </div>
                </div>
            </div>
            <div class="esquadro-reset">
                <button type="button" id="resetEsq">
                    <span class="material-symbols-outlined" aria-hidden="true">restart_alt</span>
                    Reset
                </button>
            </div>
            <!-- Fórmulas de referência -->
            <div class="esquadro-formulas">
                <p><strong>a² + b² = c²</strong></p>
                <p class="esq-hint">Proporção 3 : 4 : 5 — preencha um lado e o restante calcula ao sair do campo.</p>
            </div>


        </section>
    </main>
    <script src="esquadro.js"></script>
</body>
</html>
